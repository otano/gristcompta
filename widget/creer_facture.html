<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer une facture depuis un devis</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      --green: #16B378;
      --dark: #1a1a1a;
      --muted: #707070;
      --border: #D9D9D9;
      --bg: #fafafa;
      --red: #b00020;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px; background: var(--bg); color: var(--dark);
    }
    h1 { font-size: 17px; margin: 0 0 14px; }
    .card {
      border: 1px solid var(--border); border-radius: 8px; padding: 12px;
      margin-bottom: 14px; background: #fff;
    }
    h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .field { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; font-size: 13px; }
    .field .k { color: var(--muted); }
    .field .v { font-weight: 500; }
    .empty { font-size: 14px; color: var(--muted); padding: 8px 0; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 15px; font-weight: 600; background: var(--green); color: #fff;
    }
    .btn:disabled { background: #b7e5d2; cursor: not-allowed; }
    .status { font-size: 13px; margin-top: 12px; min-height: 16px; }
    .status.error { color: var(--red); }
    .status.ok { color: var(--green); }
    .status.info { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Créer une facture depuis un devis</h1>

  <div class="card" id="devisCard">
    <h2>Devis sélectionné</h2>
    <div id="devisEmpty" class="empty">
      Aucun devis sélectionné.<br>
      Sélectionnez un devis dans la vue « Devis », puis cliquez sur le bouton ci-dessous.
    </div>
    <div id="devisDetails" style="display:none;">
      <div class="field"><span class="k">Numéro</span><span class="v" id="dNumero">&mdash;</span></div>
      <div class="field"><span class="k">Client</span><span class="v" id="dClient">&mdash;</span></div>
      <div class="field"><span class="k">Projet</span><span class="v" id="dProjet">&mdash;</span></div>
      <div class="field"><span class="k">Total TTC</span><span class="v" id="dTotal">&mdash;</span></div>
      <div class="field"><span class="k">Statut</span><span class="v" id="dStatut">&mdash;</span></div>
      <div class="field"><span class="k">Lignes</span><span class="v" id="dLignes">&mdash;</span></div>
    </div>
  </div>

  <button id="btn" class="btn" disabled>Créer la facture</button>
  <div id="status" class="status info"></div>

  <script>
    let selectedDevis = null;   // record du devis sélectionné ({id, ...})
    let devisLines = [];        // lignes du devis (records)

    // ------------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------------
    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (type ? ' ' + type : 'info');
    }

    function fmtCurrency(v) {
      return (v == null ? '—' : Number(v).toFixed(2) + ' €');
    }

    function addDays(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }

    // Formate une date en 'YYYY-MM-DD' (attendu par les colonnes Date Grist /
    // UserActions de widget). Evite d'envoyer un objet JS Date mal encodé.
    function toISODate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    // Extrait le rowId d'une valeur de référence.
    // Le widget API renvoie parfois les références comme objet {rowId, tableId},
    // parfois comme un simple int. Normalise en int (0 si référence vide).
    function refToId(ref) {
      if (ref == null || ref === 0) { return 0; }
      if (typeof ref === 'number') { return ref; }
      if (typeof ref === 'object' && ref.rowId != null) { return ref.rowId; }
      return 0;
    }

    // Convertit une valeur de Date Grist en objet JS Date.
    // Le widget API renvoie les dates comme ["d", timestamp] (secondes epoch),
    // mais on peut aussi recevoir un timestamp (secondes) ou une string.
    function toDateJS(value) {
      if (value == null || value === '') { return null; }
      if (Array.isArray(value) && value[0] === 'd' && typeof value[1] === 'number') {
        return new Date(value[1] * 1000);
      }
      if (typeof value === 'number') { return new Date(value * 1000); }
      return new Date(value);
    }

    // Convertit un résultat columnar (objets {id: [], col: []}) en records.
    function columnarToRecords(cols) {
      const ids = cols.id || [];
      const keys = Object.keys(cols).filter(k => k !== 'id');
      return ids.map((id, i) => {
        const rec = { id };
        for (const k of keys) {
          rec[k] = (cols[k] || [])[i];
        }
        return rec;
      });
    }

    // ------------------------------------------------------------------
    // Données
    // ------------------------------------------------------------------
    async function loadDevisLines(devisId) {
      const data = await grist.docApi.fetchTable('Lignes_Document', {
        filters: { Document: [devisId] }
      });
      return columnarToRecords(data);
    }

    async function loadClientLabel(clientId) {
      const id = refToId(clientId);
      if (!id) return '—';
      try {
        const data = await grist.docApi.fetchTable('Personnes', {
          filters: { id: [id] }
        });
        const recs = columnarToRecords(data);
        if (recs.length === 0) return '#' + id;
        const p = recs[0];
        return [p.Prenom, p.Nom].filter(Boolean).join(' ') || p.Email || ('#' + id);
      } catch (e) {
        return '#' + id;
      }
    }

    async function loadProjetLabel(projetId) {
      const id = refToId(projetId);
      if (!id) return '—';
      try {
        const data = await grist.docApi.fetchTable('Projets', {
          filters: { id: [id] }
        });
        const recs = columnarToRecords(data);
        return recs.length ? (recs[0].Nom || '#' + id) : ('#' + id);
      } catch (e) {
        return '#' + id;
      }
    }

    // ------------------------------------------------------------------
    // Affichage
    // ------------------------------------------------------------------
    async function render() {
      const emptyEl = document.getElementById('devisEmpty');
      const detailsEl = document.getElementById('devisDetails');
      const btn = document.getElementById('btn');

      if (!selectedDevis || selectedDevis.Type !== 'devis') {
        emptyEl.style.display = 'block';
        detailsEl.style.display = 'none';
        btn.disabled = true;
        setStatus('Sélectionnez un devis dans la vue « Devis » pour créer sa facture.', 'info');
        return;
      }

      emptyEl.style.display = 'none';
      detailsEl.style.display = 'block';
      document.getElementById('dNumero').textContent = selectedDevis.Numero || '—';
      document.getElementById('dClient').textContent =
        await loadClientLabel(selectedDevis.Client);
      document.getElementById('dProjet').textContent =
        await loadProjetLabel(selectedDevis.Projet);
      document.getElementById('dTotal').textContent =
        fmtCurrency(selectedDevis.Total_TTC);
      document.getElementById('dStatut').textContent = selectedDevis.Statut || '—';
      document.getElementById('dLignes').textContent = devisLines.length;

      btn.disabled = false;
      setStatus('Prêt. Cliquez pour créer la facture à partir de ce devis.', 'info');
    }

    // ------------------------------------------------------------------
    // Action principale : créer la facture
    // ------------------------------------------------------------------
    async function createFacture() {
      if (!selectedDevis || selectedDevis.Type !== 'devis') {
        setStatus('Sélectionnez d\u2019abord un devis.', 'error');
        return;
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      setStatus('Création de la facture en cours...', 'info');

      try {
        // 1. Créer le document facture (copie des infos du devis, Type=facture)
        //    Source pointe vers le devis d'origine.
        //    NB: BulkAddRecord attend une liste de valeurs par colonne.
        //    On utilise un row_id négatif (-1) pour la facture : ce row_id est
        //    résolu automatiquement par le moteur dans le même lot d'actions, ce
        //    qui permet de référencer la facture dans les lignes sans dépendre
        //    de la valeur de retour.
        const factureId = -1;
        const todayStr = toISODate(new Date());
        const echeanceDate = toDateJS(selectedDevis.Date_Echeance) || addDays(new Date(), 30);
        const echeanceStr = toISODate(echeanceDate);
        const factureFields = {
          Type: ['facture'],
          Statut: ['envoye'],
          Client: [refToId(selectedDevis.Client)],
          Projet: [refToId(selectedDevis.Projet)],
          Source: [selectedDevis.id],
          Objet: [selectedDevis.Objet || ''],
          Conditions: [selectedDevis.Conditions || ''],
          Mode_Paiement: [selectedDevis.Mode_Paiement || ''],
          Date: [todayStr],
          Date_Echeance: [echeanceStr],
        };

        // Lot atomique : créer la facture, copier ses lignes, accepter le devis.
        const actions = [
          ['BulkAddRecord', 'Documents', [factureId], factureFields],
        ];

        // 2. Copier les lignes du devis vers la facture (réf négative factureId)
        if (devisLines.length > 0) {
          const ids = devisLines.map(() => null);
          const lineFields = {
            Document: devisLines.map(() => factureId),
            Description: devisLines.map(l => l.Description || ''),
            Quantite: devisLines.map(l => l.Quantite == null ? 1 : l.Quantite),
            Unite: devisLines.map(l => l.Unite || ''),
            Prix_Unitaire_HT: devisLines.map(l => l.Prix_Unitaire_HT || 0),
            TVA: devisLines.map(l => l.TVA || 0),
            Ordre: devisLines.map(l => l.Ordre || 0),
          };
          actions.push(['BulkAddRecord', 'Lignes_Document', ids, lineFields]);
        }

        // 3. Marquer le devis comme accepté (même lot)
        actions.push(['UpdateRecord', 'Documents', selectedDevis.id, { Statut: 'accepte' }]);

        await grist.docApi.applyUserActions(actions);

        setStatus('✅ Facture créée avec succès (lignes et numérotation automatiques).');
      } catch (err) {
        console.error(err);
        setStatus('Erreur : ' + (err.message || err), 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // ------------------------------------------------------------------
    // Initialisation
    // ------------------------------------------------------------------
    grist.ready({ columns: [] });

    grist.onRecord(async (record) => {
      selectedDevis = record ? { id: record.id, ...record } : null;
      devisLines = selectedDevis && selectedDevis.Type === 'devis'
        ? await loadDevisLines(selectedDevis.id)
        : [];
      render();
    });

    document.getElementById('btn').addEventListener('click', createFacture);
  </script>
</body>
</html>
